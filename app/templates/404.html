{% extends "base.html" %}

{% block title %}Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<main class="container">
    <div class="error-page">
        <div class="error-page__icon">404</div>
        <h1>Halaman Tidak Ditemukan</h1>
        <p class="error-page__message">{{ message or "Maaf, halaman yang Anda cari tidak ditemukan." }}</p>
        <a href="/" class="btn btn--primary">Kembali ke Beranda</a>
    </div>
</main>

<style>
.error-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    padding: 40px 20px;
}

.error-page__icon {
    font-size: 120px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 24px;
}

.error-page h1 {
    font-size: 2rem;
    margin-bottom: 12px;
}

.error-page__message {
    color: var(--color-text-secondary);
    font-size: 1.0625rem;
    margin-bottom: 32px;
    max-width: 500px;
}
</style>
{% endblock %}
